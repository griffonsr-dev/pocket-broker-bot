[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railway-trade-mirror"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "aiohttp>=3.13.1,<4",
    "pocket-option==0.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]